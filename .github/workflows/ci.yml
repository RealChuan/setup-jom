name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup JOM
        id: setup-jom
        uses: ./

      - name: Verify the installation
        id: verify-install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          jom /version

          $skipped = '${{ steps.setup-jom.outputs.jom-skipped }}'
          if ($skipped -ne 'false') {
            throw "Expected jom-skipped to be false, got '$skipped'"
          }

          $path = '${{ steps.setup-jom.outputs.jom-path }}'
          if ($path -ne 'C:\jom') {
            throw "Expected jom-path to be C:\jom, got '$path'"
          }

          $exe = '${{ steps.setup-jom.outputs.jom-executable }}'
          if (-not (Test-Path $exe)) {
            throw "Missing jom.exe at '$exe'"
          }

      - name: Verify the skip on other platforms
        id: verify-skip
        if: runner.os != 'Windows'
        shell: bash
        run: |
          skipped='${{ steps.setup-jom.outputs.jom-skipped }}'
          echo "jom-skipped=$skipped"
          test "$skipped" = "true"

  test-custom-install:
    name: GitHub Actions Test (custom install)
    runs-on: windows-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup pinned JOM in a custom directory
        id: setup-jom
        uses: ./
        with:
          jom-version: 1.1.7
          install-dir: ${{ runner.temp }}\jom

      - name: Verify the pinned installation
        id: verify-custom
        shell: pwsh
        run: |
          $exe = '${{ steps.setup-jom.outputs.jom-executable }}'
          if (-not (Test-Path $exe)) {
            throw "Missing jom.exe at '$exe'"
          }

          & $exe /version

          $version = '${{ steps.setup-jom.outputs.jom-version }}'
          if ($version -ne '1.1.7') {
            throw "Expected JOM 1.1.7, got '$version'"
          }
